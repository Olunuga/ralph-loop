name: ralph-bridge
version: 1
description: Gate-aware spec-driven workflow - proposal → specs → design → tasks → gate-report
artifacts:
  - id: proposal
    generates: proposal.md
    description: What changes and why
    template: proposal.md
    instruction: |
      Create the proposal that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem. What does this solve? Why now?
      - **What Changes**: One idea per bullet. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Which specs get created or modified.
        - **New Capabilities**: kebab-case names. Each becomes `specs/<name>/spec.md`.
        - **Modified Capabilities**: existing capabilities whose REQUIREMENTS change.
          Check `openspec/specs/` for existing names. Leave empty if no requirement changes.
      - **Impact**: affected code, APIs, dependencies.

      The Capabilities section is the contract between this artifact and the specs.
      Research existing specs before filling it in.

      Prose rules:
      - Write it for someone who will use the product and does not work on the code.
        Plain words, short sentences, one idea each. If a sentence needs the codebase to
        parse, it belongs in design.md.
      - No jargon. No type names, class names, file paths, framework names, or protocol
        names. Say what the person can do, not what the code provides.
      - Put every change in "What Changes". Do not bury a change in "Impact" or under its own heading.
      - Mechanism, line numbers, and failure modes belong in design.md. Do not repeat them here.
      - Name a mechanism by what it is. Never coin a term for something that already has a plain name.
      - Target 30 lines. A proposal past 50 is describing the design.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Requirements and scenarios per capability
    template: spec.md
    instruction: |
      Create one spec file per capability listed in the proposal.
      New capabilities: `specs/<capability>/spec.md` using the proposal's kebab-case name.
      Modified capabilities: use the existing folder name from `openspec/specs/<capability>/`.

      Delta operations (## headers):
      - **ADDED Requirements**, **MODIFIED Requirements** (include full updated content),
        **REMOVED Requirements** (include **Reason** and **Migration**), **RENAMED Requirements**.

      Format:
      - `### Requirement: <name>` then the rule, using SHALL/MUST.
      - `#### Scenario: <name>` with WHEN/THEN bullets.
      - **CRITICAL**: scenarios need exactly 4 hashtags. Three fails silently.
      - Every requirement needs at least one scenario.

      Prose rules:
      - Write each requirement and scenario in plain words a user would recognise. SHALL,
        MUST, WHEN, and THEN are required keywords and stay. Everything around them is
        ordinary language.
      - No jargon. Name the thing the person sees, not the type behind it. Write "the saved
        list" and not "the cached entity array".
      - One sentence per requirement. One line per WHEN or THEN bullet.
      - Keep only scenarios that constrain behaviour. Delete any scenario whose removal
        changes no implementation decision.
      - A requirement states the rule. The reason belongs in design.md.
      - No scenario that only restates the requirement in WHEN/THEN form.
      - Target 40 lines per capability file.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical decisions, risks, migration
    template: design.md
    instruction: |
      Create the design that explains HOW to implement the change.

      **Read before writing:**
      1. `ralph/gate_context.md`: accepted patterns and `- <gate_name>: SKIP|ENFORCE` entries.
      2. `scripts/gates/static/` in the ralph-loop plugin: the default static gates.
      3. `ralph/gates/static/` and `ralph/gates/llm/`: this project's own gates and overrides.

      The design MUST NOT propose an approach that a gate rejects. When a gate and the
      obvious approach conflict, either pick a different approach or record the conflict
      as a decision with its reason.

      **A design that a gate rejects costs more than a vague one.** When the change adds a
      type that a gate inspects, name its exact shape: the property or method names, and
      the type of each value. A type that carries a raw colour, a fixed font size, or any
      other literal a gate forbids has to be caught here, not after it is built. Every
      extra pass to fix one is a full iteration.

      **A design must not contradict a test the change also adds.** When the change adds a
      test that checks a rule, state the rule once and make the design obey it. A design
      that disagrees with its own test cannot be auto-fixed: each attempt satisfies one and
      breaks the other, and the iteration ends in a revert.

      If `ralph/gate_context.md` does not exist, proceed from the gate definitions alone
      and record its absence under Open Questions.

      Sections:
      - **Context**: current state, constraints.
      - **Goals / Non-Goals**.
      - **Decisions**: each keyed and titled by the decision itself.
      - **Risks / Trade-offs**: one line each: the risk, then the mitigation.
      - **Migration Plan**: deploy steps and rollback.
      - **Open Questions**.

      Prose rules:
      - Technical is correct here. Name types, files, and layers. Keep the sentences plain
        so a reader outside this change can follow the approach.
      - Write enough that someone can implement it. Stop there. No code listings, no full
        signatures, no step-by-step walkthrough. tasks.md carries the steps.
      - Lead each decision with the decision. Follow with the reason in plain sentences.
      - No "Why:" / "Alternative rejected:" / "Cost accepted:" labels. Write the reason as prose.
      - Include an alternative only when it was genuinely close. Say why it loses in one or two sentences.
      - Name a mechanism by what it is. Never coin a term for something that already has a plain name.
      - Target 80 lines.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist
    template: tasks.md
    instruction: |
      Break the implementation into trackable tasks.

      **Read before writing:** `ralph/gate_context.md`, `scripts/gates/static/`,
      `ralph/gates/static/`, `ralph/gates/llm/`.

      **Gate rule**: a task that adds a construct a gate covers MUST carry the
      gate-satisfying work in the same task or an immediately following subtask.
      A task that adds a UI element covered by an accessibility gate carries the
      accessibility work with it. A task that adds behaviour carries its test the
      same way: the test goes in that task or the next subtask, never in a
      separate "add tests" group at the end. A task must never leave the tree in
      a state a gate rejects.

      A task that only renames, moves, or reformats code adds no behaviour and
      needs no test subtask.

      **Design references**: when the change has an `assets/` directory, a task whose
      result is visual MUST name the asset file it has to match. Without that, the build
      agent cannot tell which reference applies to which task.

      **Screens named in the change get their own tasks.** Read
      `design/SCREEN_PROMPT.md` when it exists. Write one task per screen state it names,
      and do it whether or not `assets/design/` has arrived yet: the designs are delivered
      after the tasks are written, so waiting for them means the screens get no tasks at
      all. A change whose proposal describes what a person sees, and whose tasks build only
      storage, is not finished and no gate will say so.

      One design file usually holds every state, as a board with each state under its own
      label. Name the file and the label together. Do not assume one file per state, and do
      not invent a filename for a state: when the designs have not arrived, name the state
      alone and let the build agent find it.

      **A task written before the screens exist states the outcome, never the treatment.**
      Write "an empty name is refused and nothing is created". Do not write "a red line
      appears under the field": you are guessing, the designer has not chosen yet, and a
      task that names a treatment nobody drew is wrong the moment the design arrives. Say so
      in the task, so the reader knows it is open: "treatment per the design, not yet drawn".

      The drawn design is the authority. When it arrives and disagrees with a task, the task
      changes, not the design.

      **Every visual task has a verification task after it.** Running the unit tests does
      not check that a view matches its design. Name the state, name the file that shows it,
      and say what to compare. A snapshot test is the usual form.

      If `ralph/gate_context.md` does not exist, proceed from the gate definitions alone.

      **Format: the apply phase parses this, so follow it exactly:**
      - Group under `## <n>. <title>` headings.
      - Every task is `- [ ] X.Y Description`. Tasks not using `- [ ]` are not tracked.
      - Order by dependency.

      Prose rules:
      - One verifiable action per task. No task that only says "consider" or "review".
      - Reference the spec a verification task checks, by capability name.
    requires:
      - specs
      - design

  - id: gate-report
    generates: gate-report.md
    description: Gate evidence - baseline, post-implementation, delta verdict
    template: gate-report.md
    instruction: |
      Record the gate evidence for this change. Write this after implementation,
      from the two gate runs the apply phase performed.

      Sections:
      - **Baseline**: the gate result captured before any task was implemented.
      - **Post-implementation**: the gate result after the last task.
      - **Delta**: post minus baseline. This is the verdict: green or red.
      - **Suppressed**: each `- <gate_name>: SKIP` entry in `ralph/gate_context.md`
        that removed a gate from the comparison.
      - **Deferred**: each violation left unfixed, with the gate name, the reason,
        and the issue or ticket reference.

      A violation present in both runs is inherited and does not fail the change.
      A violation absent from the baseline is introduced and does fail it.
    requires:
      - tasks

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read the context files, then implement in three steps.

    **1. Baseline before any code changes.**
    Run the static gates and record the result. This is what the change is judged against.
    Do not skip this, without it, inherited violations look like new ones.

    **2. Implement the pending tasks.**
    Mark each `- [ ]` as `- [x]` only after that task's work is complete.
    Pause on blockers rather than guessing.

    **3. Post-implementation gates and delta verdict.**
    Run the static gates, then the LLM gates. The verdict is post minus baseline.
    - A violation in both runs is inherited. It does not fail the change.
    - A violation absent from the baseline is introduced. It fails the change.
    - A gate named in a `- <gate_name>: SKIP` line in `ralph/gate_context.md` is
      excluded from the comparison entirely.

    Write the result to `gate-report.md`.
